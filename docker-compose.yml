volumes:
  dialosoft-v2-db-data:
    name: dialosoft-v2-db-data
    driver: local
  dialosoft-v2-redis-data:
    name: dialosoft-v2-redis-data
    driver: local

networks:
  dialosoft-v2-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500  # Ajusta el MTU si es necesario, MTU is the maximum transmission unit of the network
