      tags:
      - Forums
  /forums/protected/restore-forum/{id}:
    put:
      description: Restores a deleted forum with the specified ID.
      parameters:
      - description: Forum ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: RESTORED
          schema:
