          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR
          schema:
            $ref: '#/definitions/response.StandardError'
      security:
      - AccessTokenAuth: []
      - RefreshTokenAuth: []
      summary: Get all forums
      tags:
      - Forums
  /forums/protected/get-forum-by-id/{id}:
    get:
      description: Retrieves a specific forum by its unique ID.
      parameters:
      - description: Forum ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
