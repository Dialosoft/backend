      responses:
        "201":
          description: CREATED
          schema:
            type: string
        "400":
          description: BAD REQUEST
          schema:
            $ref: '#/definitions/response.StandardError'
        "409":
          description: CONFLICT
          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR
          schema:
            $ref: '#/definitions/response.StandardError'
      security:
      - AccessTokenAuth: []
      - RefreshTokenAuth: []
      summary: Create a new forum
      tags:
      - Forums
  /forums/protected/delete-forum/{id}:
    delete:
      description: Deletes a forum with the specified ID.
      parameters:
      - description: Forum ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: DELETED
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: BAD REQUEST
          schema:
            $ref: '#/definitions/response.StandardError'
        "404":
          description: NOT FOUND
          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR
          schema:
            $ref: '#/definitions/response.StandardError'
      security:
      - AccessTokenAuth: []
      - RefreshTokenAuth: []
