  /management/change-user-role:
    post:
      consumes:
      - application/json
      description: Updates the role of a user and invalidates their current refresh
        token to ensure role changes are applied.
      parameters:
      - description: Change User Role Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ChangeUserRole'
      produces:
      - application/json
      responses:
        "200":
          description: UPDATED - User role updated successfully
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: BAD REQUEST - Invalid input data or parameters
          schema:
            $ref: '#/definitions/response.StandardError'
        "404":
          description: NOT FOUND - User or role not found
          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR - Unexpected server error
