  /forums/protected/get-all-forums:
    get:
      description: Retrieves a list of all forums.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ForumDto'
            type: array
        "404":
