basePath: /dialosoft-api/v1
definitions:
  dto.ForumDto:
    properties:
      categoryId:
        type: string
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      name:
        type: string
      rolesAllowed:
        items:
          type: string
        type: array
      type:
        type: string
      updatedAt:
        type: string
    required:
    - categoryId
    - name
    - type
    type: object
  request.ChangeUserRole:
    properties:
      roleID:
        example: 8213280e-2000-403a-b375-cdcda6488452
        type: string
      userID:
        example: 8213280e-2000-403a-b375-cdcda6488450
        type: string
    type: object
  request.LikeOrUnlikePost:
    properties:
      postID:
        type: string
      userID:
        type: string
    type: object
  request.LoginRequest:
    properties:
      password:
        example: "12345678"
        type: string
      username:
        example: matdevcoder
        type: string
    type: object
  request.NewCategory:
    properties:
      description:
        example: some description for category 2
        type: string
      name:
        example: Category 2
        type: string
      rolesAllowedID:
        example:
        - '[''8213280e-2000-403a-b375-cdcda6488450'''
        - ' ''roleUUID2'']'
        items:
          type: string
        type: array
    type: object
  request.NewForum:
    properties:
      categoryID:
        example: 8213280e-2000-403a-b375-cdcda6488450
        type: string
      description:
        example: some description for forum 2
        type: string
      isActive:
        example: true
        type: boolean
      name:
        example: Forum 2
        type: string
      rolesAllowed:
        example:
        - '[''8213280e-2000-403a-b375-cdcda6488450'''
        - ' ''roleUUID2'']'
        items:
          type: string
        type: array
      type:
        example: information
        type: string
    required:
    - categoryID
    type: object
  request.NewPost:
    properties:
      content:
        example: some content
        type: string
      forumID:
        example: 8213280e-2000-403a-b375-cdcda6488451
        type: string
      title:
        example: some title
        type: string
      userID:
        example: 8213280e-2000-403a-b375-cdcda6488450
        type: string
    type: object
  request.NewRole:
    properties:
      adminRole:
        example: true
        type: boolean
      modRole:
        example: false
        type: boolean
      permission:
        example: 2
        type: integer
      roleType:
        example: moderator
        type: string
    type: object
  request.NewRolePermissions:
    properties:
      canManageCategories:
        example: true
        type: boolean
      canManageForums:
        example: false
        type: boolean
      canManageRoles:
        example: true
        type: boolean
      canManageUsers:
        example: false
        type: boolean
    type: object
  request.NewUser:
    properties:
      disable:
        type: boolean
      locked:
        type: boolean
      userID:
        type: string
      username:
        type: string
    type: object
  request.RefreshToken:
    properties:
      refreshToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  request.RegisterRequest:
    properties:
      email:
        example: busta@email.com
        type: string
      password:
        example: "12345678"
        maxLength: 35
        minLength: 6
        type: string
      username:
        example: busta
        maxLength: 15
        minLength: 4
        type: string
    required:
    - email
    - password
    - username
    type: object
  request.UpdatePostContent:
    properties:
      content:
        type: string
      postID:
        type: string
    type: object
  request.UpdatePostTitle:
    properties:
      postID:
        type: string
      title:
        type: string
    type: object
  request.UserRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  response.CategoryResponse:
    properties:
      created_at:
        example: "2022-08-01T00:00:00Z"
        type: string
      description:
        example: some description for category 1
        type: string
      id:
        example: 8213280e-2000-403a-b375-cdcda6488450
        type: string
      name:
        example: Category 1
        type: string
      rolesAllowed:
        example:
        - '[''8213280e-2000-403a-b375-cdcda6488450'''
        - ' ''roleUUID2'']'
        items:
          type: string
        type: array
      updated_at:
        example: "2022-08-01T00:00:00Z"
        type: string
    type: object
  response.LoginResponse:
    properties:
      accessToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refreshToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  response.RefreshTokenResponse:
    properties:
      accessToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  response.RegisterResponse:
    properties:
      accessToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refreshToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      userID:
        example: userID
        type: string
    type: object
  response.StandardError:
    properties:
      error:
        example: An error occurred - some context
        type: string
    type: object
  response.StandardResponse:
    properties:
      data: {}
      message:
        example: info message
        type: string
    type: object
  response.ValidatorError:
    properties:
      error:
        example: Validation failed
        type: string
      fields:
        additionalProperties:
          type: string
        example:
          '{''username''': ' ''Username is required''}'
        type: object
    type: object
host: localhost:8080
info:
  contact:
    email: flussen0@gmail.com
    name: '@Flussen on github'
  description: this is the swagger implementation for dialosoft
  license:
    name: GPL-3.0 License
    url: https://www.gnu.org/licenses/gpl-3.0.html
  termsOfService: http://swagger.io/terms/
  title: Dialosoft Swagger API
  version: 0.2.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Log in a user with username and password
      parameters:
      - description: Login Request
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.LoginResponse'
        "400":
          description: Credential validation failed
          schema:
            $ref: '#/definitions/response.ValidatorError'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR
          schema:
            $ref: '#/definitions/response.StandardError'
      summary: Log in a user
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh the access token using a refresh token
      parameters:
      - description: Refresh Token Request
        in: body
        name: refreshToken
        required: true
        schema:
          $ref: '#/definitions/request.RefreshToken'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.RefreshTokenResponse'
        "400":
          description: BAD REQUEST
          schema:
            $ref: '#/definitions/response.StandardError'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR
          schema:
            $ref: '#/definitions/response.StandardError'
      summary: Refresh an access token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with username, email, and password
      parameters:
      - description: Register Request
        in: body
        name: register
        required: true
        schema:
          $ref: '#/definitions/request.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.RegisterResponse'
        "400":
          description: BAD REQUEST
          schema:
            $ref: '#/definitions/response.StandardError'
        "409":
          description: CONFLICT
          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR
          schema:
            $ref: '#/definitions/response.StandardError'
      summary: Register a new user
      tags:
      - Auth
  /categories/create-new-category:
    post:
      consumes:
      - application/json
      description: Creates a new category with a specified name.
      parameters:
      - description: New Category Data
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/request.NewCategory'
      produces:
      - application/json
      responses:
        "201":
          description: CREATED - Category created successfully
          schema:
            type: string
        "400":
          description: BAD REQUEST - Invalid input data
          schema:
            $ref: '#/definitions/response.StandardError'
        "409":
          description: CONFLICT - Category already exists
          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR - Unexpected server error
          schema:
            $ref: '#/definitions/response.StandardError'
      security:
      - AccessTokenAuth: []
      - RefreshTokenAuth: []
      summary: Create new category
      tags:
      - Categories
  /categories/get-all-categories:
    get:
      consumes:
      - application/json
      description: Retrieves a list of all categories in the system, accessible to
        all users.
      produces:
      - application/json
      responses:
        "200":
          description: List of all categories
          schema:
            items:
              $ref: '#/definitions/response.CategoryResponse'
            type: array
        "404":
          description: NOT FOUND - No categories found
          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR - Unexpected server error
          schema:
            $ref: '#/definitions/response.StandardError'
      summary: Get all categories
      tags:
      - Categories
  /categories/get-all-categories-allowed:
    get:
      consumes:
      - application/json
      description: Retrieves a list of categories that the specified role is allowed
        to access, if is Authenticated can see protected categories by role
      produces:
      - application/json
      responses:
        "200":
          description: List of accessible categories
          schema:
            items:
              $ref: '#/definitions/response.CategoryResponse'
            type: array
        "403":
          description: FORBIDDEN - Invalid roleID format in token or unauthorized
            access
          schema:
            $ref: '#/definitions/response.StandardError'
        "404":
          description: NOT FOUND - No categories found for this role
          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR - Unexpected server error
          schema:
            $ref: '#/definitions/response.StandardError'
      summary: Get allowed categories by role
      tags:
      - Categories
  /categories/protected/delete-category/{id}:
    delete:
      description: Deletes an existing category from the system.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: DELETED - Category deleted successfully
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: BAD REQUEST - Invalid category ID
          schema:
            $ref: '#/definitions/response.StandardError'
        "404":
          description: NOT FOUND - Category not found
          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR - Unexpected server error
          schema:
            $ref: '#/definitions/response.StandardError'
      security:
      - AccessTokenAuth: []
      - RefreshTokenAuth: []
      summary: Delete category
      tags:
      - Categories
  /categories/protected/restore-category/{id}:
    put:
      description: Restores a previously deleted category.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: RESTORED - Category restored successfully
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: BAD REQUEST - Invalid category ID
          schema:
            $ref: '#/definitions/response.StandardError'
        "404":
          description: NOT FOUND - Category not found
          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR - Unexpected server error
          schema:
            $ref: '#/definitions/response.StandardError'
      security:
      - AccessTokenAuth: []
      - RefreshTokenAuth: []
      summary: Restore category
      tags:
      - Categories
  /categories/protected/update-category/{id}:
    put:
      consumes:
      - application/json
      description: Updates an existing category with new data.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated Category Data
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/request.NewCategory'
      produces:
      - application/json
      responses:
        "200":
          description: UPDATED - Category updated successfully
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: BAD REQUEST - Invalid input data
          schema:
            $ref: '#/definitions/response.StandardError'
        "404":
          description: NOT FOUND - Category not found
          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR - Unexpected server error
          schema:
            $ref: '#/definitions/response.StandardError'
      security:
      - AccessTokenAuth: []
      - RefreshTokenAuth: []
      summary: Update category
      tags:
      - Categories
  /forums/get-forums-by-category-id/{categoryID}:
    get:
      description: Retrieves forums by category ID if allowed for the role.
      parameters:
      - description: Category ID
        in: path
        name: categoryID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ForumDto'
            type: array
        "400":
          description: BAD REQUEST
          schema:
            $ref: '#/definitions/response.StandardError'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/response.StandardError'
        "404":
          description: NOT FOUND
          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR
          schema:
            $ref: '#/definitions/response.StandardError'
      security:
      - AccessTokenAuth: []
      - RefreshTokenAuth: []
      summary: Get forums by category ID
      tags:
      - Forums
  /forums/protected/create-new-forum:
    post:
      consumes:
      - application/json
      description: Creates a new forum with the specified details.
      parameters:
      - description: New Forum Data
        in: body
        name: forum
        required: true
        schema:
          $ref: '#/definitions/request.NewForum'
      produces:
