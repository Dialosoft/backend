        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ForumDto'
        "400":
          description: BAD REQUEST
          schema:
            $ref: '#/definitions/response.StandardError'
        "404":
          description: NOT FOUND
          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR
          schema:
            $ref: '#/definitions/response.StandardError'
      security:
      - AccessTokenAuth: []
      - RefreshTokenAuth: []
