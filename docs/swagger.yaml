            $ref: '#/definitions/response.StandardError'
      security:
      - AccessTokenAuth: []
      - RefreshTokenAuth: []
      summary: Change user role
      tags:
      - Management
  /posts/authenticated/create-new-post:
    post:
      consumes:
      - application/json
      description: Creates a new post with the provided data.
      parameters:
      - description: New Post Data
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/request.NewPost'
      produces:
      - application/json
      responses:
        "201":
          description: CREATED - New post created successfully
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: BAD REQUEST - Invalid input data
          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR - Unexpected server error
          schema:
            $ref: '#/definitions/response.StandardError'
      security:
      - AccessTokenAuth: []
      - RefreshTokenAuth: []
      summary: Create a new post
      tags:
      - Posts
  /posts/authenticated/like-post:
    put:
      consumes:
      - application/json
      description: Adds a like to a specific post from a user.
      parameters:
      - description: Post and User ID for liking
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/request.LikeOrUnlikePost'
      produces:
      - application/json
      responses:
        "200":
          description: LIKED - Post liked successfully
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: BAD REQUEST - Invalid input data
          schema:
            $ref: '#/definitions/response.StandardError'
        "404":
          description: NOT FOUND - Post or user not found
          schema:
            $ref: '#/definitions/response.StandardError'
        "409":
          description: CONFLICT - Post already liked by the user
          schema:
            $ref: '#/definitions/response.StandardError'
        "500":
          description: INTERNAL SERVER ERROR - Unexpected server error
          schema:
            $ref: '#/definitions/response.StandardError'
      security:
      - AccessTokenAuth: []
      - RefreshTokenAuth: []
      summary: Like post
      tags:
      - Posts
  /posts/authenticated/unlike-post:
    put:
      consumes:
      - application/json
      description: Removes a like from a specific post by a user.
      parameters:
      - description: Post and User ID for unliking
